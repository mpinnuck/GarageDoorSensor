; Garage door Matter sensor - Seeed XIAO ESP32C3
; Uses the pioarduino platform, which provides Arduino ESP32 core 3.x
; (needed for the Matter library). The stock "espressif32" platform is
; still on core 2.x and will not build this sketch.

[env:xiao_esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

; Matter needs the large app partition (3 MB, no OTA)
board_build.partitions = huge_app.csv

; XIAO C3 serial goes over its native USB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION=\"2.1.0\"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
