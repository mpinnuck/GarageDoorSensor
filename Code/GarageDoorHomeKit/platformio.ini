; Garage door sensor - Seeed XIAO ESP32C3, Apple HomeKit via HomeSpan
; pioarduino platform = Arduino ESP32 core 3.x (HomeSpan 2.x needs core 3).

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = https://github.com/HomeSpan/HomeSpan.git#2.1.8

; Two 1.9 MB app slots so firmware can be updated over Wi-Fi (OTA).
; The partition layout only changes over USB, so the first install must be USB.
board_build.partitions = min_spiffs.csv

; XIAO C3 serial goes over its native USB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION=\"3.1.0\"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; First install, over USB:   pio run -e usb -t erase   then   pio run -e usb -t upload
[env:usb]

; Later updates over Wi-Fi:  pio run -e ota -t upload
; --auth must match OTA_PASSWORD in include/secrets.h
[env:ota]
upload_protocol = espota
upload_port = garagedoor.local
upload_flags = --auth=tinka
